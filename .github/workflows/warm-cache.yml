name: Warm weather cache

# Fetches Open-Meteo data ahead of time and commits it, so the deployed Vercel
# app serves known cities entirely from weather_cache/ with no live API calls.
# Runs from GitHub's runners (not Vercel's shared IPs) and spaces its requests
# out to stay under Open-Meteo's rate limits.
#
#   daily  -> current-year ranges only (fast, keeps the comparison charts fresh)
#   weekly -> full refresh, including the historical baseline for any new cities
#   manual -> full; pass names to warm just those

on:
  schedule:
    - cron: '17 5 * * *'    # daily 05:17 UTC
    - cron: '43 4 * * 1'    # Mondays 04:43 UTC
  workflow_dispatch:
    inputs:
      cities:
        description: 'Space-separated city names (blank = cities.txt + city_cache.csv)'
        required: false
        default: ''

concurrency:
  group: warm-cache
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Warm the cache
        id: warm
        continue-on-error: true
        run: |
          if [ "${{ github.event.schedule }}" = "17 5 * * *" ]; then
            python scripts/warm_cache.py --current-year-only
          else
            python scripts/warm_cache.py ${{ github.event.inputs.cities }}
          fi

      - name: Commit any changes
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add weather_cache city_cache.csv
          if git diff --cached --quiet; then
            echo "No cache changes."
          else
            git commit -m "Warm weather cache ($(date -u +%Y-%m-%d))"
            git push
          fi

      # Surface a partial failure (some cities couldn't be warmed) without losing
      # the cities that did succeed -- those were committed by the step above.
      - name: Flag partial failure
        if: steps.warm.outcome == 'failure'
        run: |
          echo "::warning::Some cities failed to warm; re-run to pick up the rest."
          exit 1
